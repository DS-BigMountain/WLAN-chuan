<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>传 · 局域网文件传输</title><link rel="stylesheet" href="/web/style.css"><script type="module" src="/web/app.js"></script></head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 14v7h16v-7"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 8M20 3v7h-7"/></symbol>
<symbol id="i-computer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></symbol>
<symbol id="i-browser" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20M6 5.5h.1m3 0h.1"/></symbol>
<symbol id="i-ping" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="m5 18 1-5L16 3l5 5-10 10H5Zm-1 4h16"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l3 3h9v12H3V7Z"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 10h6m-6 4h6"/></symbol>
<symbol id="i-delete" viewBox="0 0 24 24"><path d="M4 6h16M9 3h6M6 9l1 12h10l1-12M10 10v7m4-7v7"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
</defs></svg>
<header class="app-header"><div class="brand"><span class="mark"><svg class="icon" aria-hidden="true"><use href="#i-transfer"/></svg></span><div><h1>传</h1><span>局域网文件传输</span></div></div><div class="identity"><span id="identity">正在登记浏览器</span><span id="host"></span></div><span id="service-status" class="connection-badge">正在连接</span><div class="header-actions"><button id="limits" type="button">设置</button><a class="button desktop-only" href="/download/Chuan.exe"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Windows 客户端</a><a id="android-client" class="button desktop-only" href="/download/Chuan.apk" hidden><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Android 客户端</a></div></header>
<p id="connection" role="status" class="notice" hidden></p>
<button id="device-backdrop" aria-label="关闭设备选择" hidden></button>
<div class="workspace">
<aside id="peer-sidebar" class="sidebar"><div class="section-heading"><h2>附近设备 <span id="peer-count" class="count">0</span></h2><button id="refresh" class="icon-button" title="刷新设备" aria-label="刷新设备"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button><button id="close-device-sheet" class="text-button mobile-only">关闭</button></div><div id="devices" class="device-list" aria-label="在线设备"></div><div class="peer-tools"><button id="ping" disabled><svg class="icon" aria-hidden="true"><use href="#i-ping"/></svg>Ping</button><button id="note" disabled><svg class="icon" aria-hidden="true"><use href="#i-note"/></svg>IP 备注</button></div><div class="host-summary"><span>当前浏览器</span><strong id="browser-name"></strong><span id="browser-ip"></span><hr><span>服务地址</span><code id="service-origin"></code></div></aside>
<main class="main"><div class="content-heading"><h2>文件传输</h2><span id="receive-mode" class="muted"></span></div>
<div id="target-card" class="target-bar"><svg class="icon target-icon" aria-hidden="true"><use id="target-glyph" href="#i-computer"/></svg><div class="target-copy"><span>目标设备</span><strong id="target-name">请选择设备</strong><small id="target-ip"></small></div><button id="switch-device" class="mobile-only">切换</button></div>
<section class="send-section" aria-label="发送文件"><div id="drop" class="drop disabled" role="button" aria-label="选择要发送的文件" tabindex="-1" aria-disabled="true"><span class="upload-icon"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg></span><h3 id="drop-title">请先选择目标设备</h3><p id="drop-detail">选择在线设备后启用发送</p><div class="file-actions"><button id="choose-files" class="primary" disabled><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>选择文件</button><button id="choose-folder" disabled><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>选择文件夹</button></div><p id="folder-picker-help" class="directory-help" hidden></p></div><input id="picker" type="file" multiple hidden disabled><input id="folder-picker" type="file" webkitdirectory directory multiple hidden disabled></section>
<div id="requests" aria-live="polite" hidden></div>
<section class="jobs-section" aria-label="本次传输"><div class="section-heading"><h2>本次传输</h2><div class="filters" role="group" aria-label="筛选传输记录"><button data-job-filter="all" class="active" aria-pressed="true">全部 (0)</button><button data-job-filter="send" aria-pressed="false">发送 (0)</button><button data-job-filter="receive" aria-pressed="false">接收 (0)</button></div><button id="clear" class="text-button"><svg class="icon" aria-hidden="true"><use href="#i-delete"/></svg>清除已结束</button></div><div id="jobs" class="rows jobs" aria-live="polite"><p class="empty">暂无传输任务</p></div></section>
</main></div><footer><span id="footer-origin"></span><span id="version"></span><a id="android-mobile" href="/download/Chuan.apk" hidden>安装 Android 应用</a></footer>
<dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><p id="dialog-description"></p><label id="dialog-label" for="dialog-input">临时备注</label><input id="dialog-input" maxlength="48" autocomplete="off"><div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button id="dialog-confirm" value="confirm" class="primary">保存</button></div></form></dialog>
<dialog id="limits-dialog" aria-labelledby="limits-title"><form id="limits-form" method="dialog"><h2 id="limits-title">传输设置</h2><label><input id="zip-folders" type="checkbox">发送文件夹时打包为 ZIP（默认关闭）</label><p>0 表示无限制。</p><label for="limit-files">单批文件数量</label><input id="limit-files" type="text" inputmode="numeric" pattern="[0-9]+" required value="0"><label for="limit-mib">单批总大小（MiB）</label><input id="limit-mib" type="text" inputmode="numeric" pattern="[0-9]+" required value="0"><p id="limits-error" role="alert"></p><button id="export-diagnostics" type="button">导出诊断日志</button><div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></div></form></dialog>
<div id="ping-flash" aria-hidden="true"></div>
</body></html>
