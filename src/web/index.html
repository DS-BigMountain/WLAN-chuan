<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>传 · 局域网文件传输</title><link rel="stylesheet" href="/web/style.css"><script type="module" src="/web/app.js"></script></head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 14v7h16v-7"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 8M20 3v7h-7"/></symbol>
<symbol id="i-computer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></symbol>
<symbol id="i-browser" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20M6 5.5h.1m3 0h.1"/></symbol>
<symbol id="i-ping" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="m5 18 1-5L16 3l5 5-10 10H5Zm-1 4h16"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l3 3h9v12H3V7Z"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 10h6m-6 4h6"/></symbol>
<symbol id="i-delete" viewBox="0 0 24 24"><path d="M4 6h16M9 3h6M6 9l1 12h10l1-12M10 10v7m4-7v7"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
</defs></svg>
<main>
<header><div class="brand"><span class="mark"><svg class="icon" aria-hidden="true"><use href="#i-transfer"/></svg></span><div><h1>传</h1><p>局域网文件传输</p></div></div><div class="connection-info"><p id="identity">正在登记客户端</p><p id="host"></p></div><button id="limits" type="button">设置</button><a class="button download-app" href="/download/Chuan.exe"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span>Windows 客户端</span></a></header>
<p id="connection" role="status" class="notice" hidden></p>
<div class="workspace">
<aside><div class="section-title"><h2>附近设备</h2><button id="refresh" class="icon-button" type="button" title="刷新设备" aria-label="刷新设备"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div><div id="devices" class="devices" aria-label="在线设备"></div><div class="peer-tools"><button id="ping" disabled><svg class="icon" aria-hidden="true"><use href="#i-ping"/></svg>Ping</button><button id="note" disabled><svg class="icon" aria-hidden="true"><use href="#i-note"/></svg>IP 备注</button></div></aside>
<article><div class="content-heading"><div><h2>文件传输</h2><p>设备互联 · 文件直达</p></div><span id="receive-mode" class="mode"></span></div>
<section class="send-section" aria-label="发送文件"><div role="button" aria-label="选择要发送的文件" id="drop" class="drop disabled" tabindex="-1" aria-disabled="true"><span class="file-icon"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg></span><strong id="drop-title">请先选择目标设备</strong><span id="drop-detail">选择在线设备后启用发送</span></div><div class="selection-tools"><button id="choose-files" disabled>选择文件</button><button id="choose-folder" disabled>选择文件夹</button></div><input id="picker" type="file" multiple hidden disabled><input id="folder-picker" type="file" webkitdirectory directory hidden disabled></section>
<div id="requests" aria-live="polite" hidden></div><section class="transfer-section"><div class="section-title"><h2>传输状态</h2><button id="clear">清除已结束</button></div><div id="jobs" class="rows" aria-live="polite"><p class="empty">暂无传输任务</p></div></section></article>
</div><footer><span class="footer-label">传 · 局域网文件传输</span><span id="version"></span></footer>
</main>
<dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form id="dialog-form" method="dialog"><h2 id="dialog-title"></h2><p id="dialog-description"></p><label id="dialog-label" for="dialog-input">临时备注</label><input id="dialog-input" maxlength="48" autocomplete="off"><div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button id="dialog-confirm" value="confirm" class="primary">保存</button></div></form></dialog>
<dialog id="limits-dialog" aria-labelledby="limits-title"><form id="limits-form" method="dialog"><h2 id="limits-title">传输上限</h2><p>每批发送或接收的上限。0 表示无限制；服务主机及接收方的设置仍然有效。</p><label for="limit-files">单批文件数量</label><input id="limit-files" type="text" inputmode="numeric" pattern="[0-9]+" required value="0"><label for="limit-mib">单批总大小（MiB）</label><input id="limit-mib" type="text" inputmode="numeric" pattern="[0-9]+" required value="0"><p id="limits-error" role="alert"></p><div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></div></form></dialog>
<div id="ping-flash" aria-hidden="true"></div>
</body></html>
