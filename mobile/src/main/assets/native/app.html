<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>传</title><link rel="stylesheet" href="/web/style.css"><link rel="stylesheet" href="/native/app.css"><script type="module" src="/native/app.js"></script></head>
<body>
<!-- ORIGINAL_ICONS -->
<header class="app-header"><div class="brand"><img src="/web/chuan.svg" width="37" height="37" alt=""><div><h1>传</h1><span>局域网文件传输</span></div></div><span id="service-status" class="connection-badge">正在开启服务</span><button id="settings-button">设置</button><div class="service-line"><span id="host-name"></span><button id="copy-address" class="text-button">复制 Web 地址</button></div></header>
<p id="notice" role="status" class="notice" hidden></p>
<main class="main">
<div class="content-heading"><h2>文件传输</h2><div class="receive-mode"><span>自动接收</span><label class="switch"><input id="auto-receive" type="checkbox" aria-label="自动接收"><span></span></label></div></div>
<div id="target" class="target-bar"><svg class="icon target-icon"><use href="#i-computer"/></svg><div class="target-copy"><span>目标设备</span><strong id="target-name">请选择设备</strong><small id="target-ip"></small></div><button id="switch-device">切换</button></div>
<section class="send-section" aria-label="发送文件"><div class="drop"><span class="upload-icon"><svg class="icon"><use href="#i-upload"/></svg></span><h3>选择要发送的文件</h3><p id="send-detail">选择目标设备后发送</p><div class="file-actions"><button id="choose-files" class="primary" disabled><svg class="icon"><use href="#i-file"/></svg>选择文件</button><button id="choose-folder" disabled><svg class="icon"><use href="#i-folder"/></svg>选择文件夹</button></div><button id="send-shared" class="primary" hidden></button></div></section>
<div id="requests" aria-live="polite" hidden></div>
<section class="jobs-section" aria-label="本次传输"><div class="section-heading"><h2>本次传输</h2><div class="filters" role="group" aria-label="筛选传输记录"><button data-filter="all" class="active" aria-pressed="true">全部 (0)</button><button data-filter="send" aria-pressed="false">发送 (0)</button><button data-filter="receive" aria-pressed="false">接收 (0)</button></div><button id="clear" class="text-button"><svg class="icon"><use href="#i-delete"/></svg>清除已结束</button></div><div id="jobs" class="jobs"></div></section>
<section class="utility-panel" aria-label="接收目录与 Web 服务"><div class="directory-bar"><svg class="icon"><use href="#i-folder"/></svg><div class="utility-copy"><span>接收目录</span><strong id="directory"></strong></div><div class="utility-actions"><button id="choose-directory" class="text-button">查看</button><button id="change-directory" class="text-button">修改</button></div></div><div class="server-bar"><svg class="icon"><use href="#i-browser"/></svg><div class="utility-copy"><span>Web 服务</span><p id="server-address"></p></div><div class="utility-actions"><button id="open-web" class="text-button">打开</button><button id="toggle-service" class="text-button">停止服务</button></div></div></section>
</main><footer><span id="version">传 · 2.1.1 · Android</span></footer>
<dialog id="devices-dialog"><div class="dialog-heading"><h2>附近设备 <span id="peer-count" class="count"></span></h2><button id="refresh" class="icon-button" aria-label="刷新设备"><svg class="icon"><use href="#i-refresh"/></svg></button><button data-close class="text-button">关闭</button></div><div id="devices" class="device-list"></div><div class="peer-tools"><button id="ping" disabled><svg class="icon"><use href="#i-ping"/></svg>Ping</button><button id="note" disabled><svg class="icon"><use href="#i-note"/></svg>IP 备注</button></div><button id="connect" class="connect-button">手动连接</button></dialog>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>设置</h2><button data-close class="text-button">关闭</button></div><form id="settings-form"><label>设备名称<input name="name" maxlength="64" required></label><label>监听端口<input name="port" inputmode="numeric" pattern="[0-9]+" required></label><label class="check-row"><input name="autoReceive" type="checkbox">自动接收文件</label><label class="check-row"><input name="shareSoftware" type="checkbox">提供 Web 服务与客户端安装包下载</label><label class="check-row"><input name="zipFolders" type="checkbox">发送文件夹时打包为 ZIP（默认关闭）</label><label>单批文件数量（0 = 无限）<input name="maxFiles" inputmode="numeric" pattern="[0-9]+" required></label><label>单批总大小（MiB，0 = 无限）<input name="maxMiB" inputmode="numeric" pattern="[0-9]+" required></label><button id="export-diagnostics" type="button">导出诊断日志</button><button id="receive-directory" type="button">选择接收目录</button><button id="reset-directory" type="button">使用应用目录</button><p id="settings-error" class="error" role="alert"></p><button class="primary" type="submit">保存设置</button></form></dialog>
<dialog id="text-dialog"><form id="text-form"><h2 id="text-title"></h2><p id="text-detail"></p><input id="text-input" maxlength="64" required><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="folder-dialog"><div class="dialog-heading"><h2 id="folder-title">文件夹内容</h2><button data-close class="text-button">关闭</button></div><div id="folder-files"></div></dialog>
<div id="ping-flash" aria-hidden="true"></div>
</body></html>
